<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本 47 都道府縣制霸互動圖 (Excel 用戶查詢版)</title>
    <!-- Tailwind CSS 樣式框架 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .prefecture {
            transition: fill 0.3s ease, stroke 0.3s ease;
            cursor: pointer;
            stroke: #ffffff;
            stroke-width: 8px;
        }
        .prefecture:hover {
            stroke: #1e293b;
            stroke-width: 15px;
            filter: brightness(0.9);
        }
        /* Tooltip 樣式 */
        #tooltip {
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between font-sans">

    <!-- 頂部標題區 -->
    <header class="bg-white shadow-sm border-b border-slate-200 py-4 px-6">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
                    🇯🇵 日本 47 都道府縣制霸互動圖
                </h1>
                <p class="text-sm text-slate-500 mt-1">根據上傳 Excel 資料庫建置，輸入用戶代號（C01 ~ C32）查詢足跡</p>
            </div>
            
            <!-- 查詢控制器 -->
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <div class="relative flex-1 sm:flex-initial">
                    <input type="text" id="userInput" placeholder="請輸入用戶代號 (例: C01)" 
                        class="w-full sm:w-52 px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm uppercase">
                </div>
                <button onclick="handleSearch()" 
                    class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg text-sm font-medium transition shadow-sm whitespace-nowrap">
                    查詢
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        
        <!-- 左側：地圖顯示區 (佔 7 格) -->
        <div class="lg:col-span-7 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col items-center relative">
            <div class="w-full flex justify-between items-center mb-4">
                <h2 class="font-semibold text-slate-700 text-lg" id="mapTitle">目前檢視：尚未選擇用戶
